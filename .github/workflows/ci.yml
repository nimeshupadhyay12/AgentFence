name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests + attack simulations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run test suite
        working-directory: backend
        run: python -m pytest -q
      - name: Run attack simulations on a fresh database
        env:
          AGENTFENCE_DATA_DIR: ${{ runner.temp }}/agentfence-sim
        run: |
          export AGENTFENCE_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          python scripts/run_simulations.py
      - name: Refuse to start in prod without a signing key
        working-directory: backend
        env:
          AGENTFENCE_ENV: prod
          AGENTFENCE_DATA_DIR: ${{ runner.temp }}/agentfence-prod
        run: |
          if python -c "import app.core.config" 2>/dev/null; then
            echo "Gateway started in prod mode without a secret" && exit 1
          fi
          echo "Refused as expected"

  frontend:
    name: Dashboard type-check + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
